<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mate</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        @font-face {
            font-family: 'MainFont';
            src: url('Шрифты/AbegPrettyLindaCute.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        html, body {
            background:#111;
            color:#fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height:100vh;
        }
        .video-background {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:0;
            pointer-events:none;
        }
        .video-overlay {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.85);
            z-index:1;
            pointer-events:none;
        }
        .container {
            position:relative;
            z-index:2;
            max-width:1100px;
            margin:0 auto;
            padding:4rem 2rem;
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }
        .top-bar {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:3rem;
            position:relative;
        }
        .page-title-left {
            font-size:1.4rem;
            letter-spacing:0.3em;
            text-transform:uppercase;
            color:#c0c0c0;
            font-weight:300;
        }
        .burger {
            display:none;
        }
        .nav {
            display:flex;
            gap:2rem;
        }
        .nav a {
            color:#c0c0c0;
            text-decoration:none;
            font-size:0.8rem;
            text-transform:uppercase;
            letter-spacing:0.15em;
            transition:color 0.2s;
        }
        .nav a:hover, .nav a.active {
            color:#fff;
        }
        .nav-sep {
            color:#444;
            font-size:0.8rem;
        }
        .nav-home {
            color:#666 !important;
        }
        .nav-home:hover {
            color:#fff !important;
        }
        .month-title {
            font-size:1.2rem;
            letter-spacing:0.3em;
            text-transform:uppercase;
            color:#888;
            font-weight:300;
            margin-bottom:2rem;
        }
        .events {
            display:flex;
            flex-direction:column;
            gap:1.5rem;
        }
        .event {
            display:flex;
            align-items:center;
            gap:2rem;
            padding-bottom:1.5rem;
            border-bottom:1px solid #222;
        }
        .event-date {
            font-size:1.4rem;
            font-weight:300;
            color:#e0e0e0;
            min-width:80px;
        }
        .event-info {
            flex:1;
        }
        .event-venue {
            font-size:1rem;
            font-weight:500;
            margin-bottom:0.3rem;
        }
        .event-time {
            font-size:0.85rem;
            color:#888;
        }
        .event-tag {
            font-size:0.75rem;
            text-transform:uppercase;
            letter-spacing:0.2em;
            color:#888;
            border:1px solid #333;
            padding:0.4rem 0.9rem;
            border-radius:20px;
        }
        @media (max-width: 768px) {
            .container {
                padding:2rem 1rem;
            }
            .page-title-left {
                font-size:1rem;
            }
            .burger {
                display:flex;
                flex-direction:column;
                justify-content:center;
                gap:5px;
                width:32px;
                height:32px;
                background:none;
                border:none;
                cursor:pointer;
                padding:0;
                z-index:20;
            }
            .burger span {
                display:block;
                width:24px;
                height:2px;
                background:#c0c0c0;
                transition:all 0.3s;
            }
            .burger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
            .burger.open span:nth-child(2) { opacity:0; }
            .burger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
            .nav {
                display:none;
                position:absolute;
                top:100%;
                right:0;
                flex-direction:column;
                gap:1rem;
                padding:1.5rem;
                background:rgba(0,0,0,0.95);
                border-radius:12px;
                min-width:160px;
                z-index:15;
            }
            .nav.open {
                display:flex;
            }
            .nav a {
                font-size:0.8rem;
                letter-spacing:0.15em;
            }
            .event {
                flex-wrap:wrap;
                gap:1rem;
            }
            .event-tag {
                margin-left:0;
            }
        }
    </style>
</head>
<body>
    <video class="video-background" autoplay muted loop playsinline>
        <source src="Видео/Фон.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
    <div class="container">
        <div class="top-bar">
            <div class="page-title-left">Dates</div>
            <button class="burger" id="burger" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav" id="navMain">
                <a href="/mate/music.html">Music</a>
                <a href="/mate/video.html">Video</a>
                <a href="/mate/photos.html">Photos</a>
                <a href="/mate/dates.html" class="active">Dates</a>
                <a href="/mate/booking.html">Booking</a>
                <span class="nav-sep">/</span>
                <a href="/mate/index.html" class="nav-home">Home</a>
            </nav>
        </div>
        
        <div class="month-title">September</div>
        
        <div class="events">
            <div class="event">
                <div class="event-date">12.09</div>
                <div class="event-info">
                    <div class="event-venue">Tooman</div>
                    <div class="event-time">22:00</div>
                </div>
                <div class="event-tag">DJ set</div>
            </div>
        </div>
    </div>
    
    <script>
        const burger = document.getElementById('burger');
        const navMain = document.getElementById('navMain');
        if (burger) {
            burger.addEventListener('click', () => {
                burger.classList.toggle('open');
                navMain.classList.toggle('open');
            });
        }
    </script>
</body>
</html>
