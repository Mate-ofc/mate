<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mate — Photos</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        @font-face {
            font-family: 'MainFont';
            src: url('Шрифты/AbegPrettyLindaCute.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        html, body {
            background:#111;
            color:#fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height:100vh;
        }
        .video-background {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:0;
            pointer-events:none;
        }
        .video-overlay {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.85);
            z-index:1;
            pointer-events:none;
        }
        .container {
            position:relative;
            z-index:2;
            max-width:1100px;
            margin:0 auto;
            padding:4rem 2rem;
        }
        .top-bar {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:3rem;
        }
        .logo-small {
            font-family: 'MainFont', sans-serif;
            font-size:2.5rem;
            letter-spacing:-0.02em;
            color:#fff;
            text-decoration:none;
        }
        .nav {
            display:flex;
            gap:2rem;
        }
        .nav a {
            color:#888;
            text-decoration:none;
            font-size:0.8rem;
            text-transform:uppercase;
            letter-spacing:0.15em;
            transition:color 0.2s;
        }
        .nav a:hover, .nav a.active {
            color:#fff;
        }
        .page-title {
            font-size:1.8rem;
            letter-spacing:0.3em;
            text-transform:uppercase;
            color:#888;
            margin-bottom:1.5em;
            text-align:center;
        }
        .collage {
            display:grid;
            grid-template-columns:repeat(3, 1fr);
            gap:12px;
            align-items:start;
        }
        .photo {
            position:relative;
            display:block;
            border-radius:6px;
            overflow:hidden;
            cursor:pointer;
        }
        .photo img {
            width:100%;
            height:auto;
            display:block;
        }
        .photo::after {
            content:'';
            position:absolute;
            inset:0;
            background:rgba(25,10,50,0.55);
            transition:opacity 0.3s;
            pointer-events:none;
        }
        .photo:hover::after {
            opacity:0;
        }
        .footer {
            margin-top:4em;
            font-size:0.7rem;
            color:#555;
            text-align:center;
        }
        @media (max-width: 768px) {
            .container {
                padding:2rem 1rem;
            }
            .logo-small {
                font-size:2rem;
            }
            .nav {
                gap:1rem;
            }
            .nav a {
                font-size:0.7rem;
                letter-spacing:0.1em;
            }
            .collage {
                grid-template-columns:repeat(2, 1fr);
                gap:8px;
            }
        }
    </style>
</head>
<body>
    <video class="video-background" autoplay muted loop playsinline>
        <source src="Видео/Фон.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
    <div class="container">
        <div class="top-bar">
            <a href="/mate/index.html" class="logo-small">Mate</a>
            <nav class="nav">
                <a href="/mate/index.html">Home</a>
                <a href="/mate/photos.html" class="active">Photos</a>
            </nav>
        </div>
        <div class="page-title">Gallery</div>
        <div class="collage">
            <div class="photo"><img src="Фото/small/0058.jpg" alt="Photo"></div>
            <div class="photo"><img src="Фото/small/0062.jpg" alt="Photo"></div>
            <div class="photo"><img src="Фото/small/0063.jpg" alt="Photo"></div>
            <div class="photo"><img src="Фото/small/0064.jpg" alt="Photo"></div>
            <div class="photo"><img src="Фото/small/0068.jpg" alt="Photo"></div>
            <div class="photo"><img src="Фото/small/0069.jpg" alt="Photo"></div>
        </div>
        <div class="footer">© 2026 Mate. All rights reserved.</div>
    </div>
</body>
</html>
