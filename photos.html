<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mate</title>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://matesound.github.io/">
    <meta property="og:title" content="Mate">
    <meta property="og:description" content="Добро пожаловать в мой музыкальный мир">
    <meta property="og:image" content="https://matesound.github.io/og/preview_og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mate">
    <meta name="twitter:description" content="Добро пожаловать в мой музыкальный мир">
    <meta name="twitter:image" content="https://matesound.github.io/og/preview_og.jpg">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        @font-face {
            font-family: 'MainFont';
            src: url('Шрифты/AbegPrettyLindaCute.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        html, body {
            scrollbar-gutter:stable;
            scrollbar-width:thin;
            scrollbar-color:#333 transparent;
            background:#111;
            color:#fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height:100vh;
        }
        .video-background {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:0;
            pointer-events:none;
        }
        .video-overlay {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.85);
            z-index:1;
            pointer-events:none;
        }
        .container {
            position:relative;
            z-index:2;
            max-width:1100px;
            margin:0 auto;
            padding:4rem 2rem;
        }
        .top-bar {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:3rem;
        }
        .page-title-left {
            font-size:1.4rem;
            letter-spacing:0.3em;
            text-transform:uppercase;
            color:#c0c0c0;
            font-weight:300;
        }
        .burger {
            display:none;
        }
        .nav {
            display:flex;
            gap:2rem;
        }
        .nav a {
            color:#c0c0c0;
            text-decoration:none;
            font-size:0.8rem;
            text-transform:uppercase;
            letter-spacing:0.15em;
            transition:color 0.2s;
        }
        .nav a:hover, .nav a.active {
            color:#fff;
        }
        .nav-sep {
            color:#444;
            font-size:0.8rem;
        }
        .nav-home {
            color:#666 !important;
        }
        .nav-home:hover {
            color:#fff !important;
        }

        .collage {
            display:grid;
            grid-template-columns:repeat(3, 1fr);
            gap:12px;
            align-items:start;
        }
        .photo {
            position:relative;
            display:block;
            border-radius:6px;
            overflow:hidden;
            cursor:pointer;
        }
        .photo img {
            width:100%;
            height:auto;
            display:block;
        }
        .photo img {
            filter:saturate(1.3) contrast(1.1) brightness(0.9);
            transition:filter 0.3s;
        }
        .photo::after {
            content:'';
            position:absolute;
            inset:0;
            background:rgba(10,15,30,0.3);
            transition:opacity 0.3s;
            pointer-events:none;
        }
        .photo:hover::after {
            opacity:0;
        }
        .photo:hover img {
            filter:saturate(1) contrast(1) brightness(1);
        }
        .footer {
            margin-top:4em;
            font-size:0.7rem;
            color:#555;
            text-align:center;
        }
        @media (max-width: 768px) {
            .container {
                padding:2rem 1rem;
            }
            .page-title-left {
                font-size:1rem;
            }
            .burger {
                display:flex;
                flex-direction:column;
                justify-content:center;
                gap:5px;
                width:32px;
                height:32px;
                background:none;
                border:none;
                cursor:pointer;
                padding:0;
                z-index:20;
            }
            .burger span {
                display:block;
                width:24px;
                height:2px;
                background:#c0c0c0;
                transition:all 0.3s;
            }
            .burger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
            .burger.open span:nth-child(2) { opacity:0; }
            .burger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
            .nav {
                display:none;
                position:absolute;
                top:100%;
                right:0;
                flex-direction:column;
                gap:1rem;
                padding:1.5rem;
                background:rgba(0,0,0,0.95);
                border-radius:12px;
                min-width:160px;
                z-index:15;
            }
            .nav.open {
                display:flex;
            }
            .nav a {
                font-size:0.8rem;
                letter-spacing:0.15em;
            }
            .top-bar {
                position:relative;
            }
            .collage {
                grid-template-columns:repeat(2, 1fr);
                gap:8px;
            }
        }
            ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }
        ::-webkit-scrollbar-thumb:hover { background:#555; }
    </style>
</head>
<body>
    <video class="video-background" autoplay muted loop playsinline>
        <source src="Видео/Фон.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
    <div class="container">
        <div class="top-bar">
            <div class="page-title-left">Gallery</div>
            <button class="burger" id="burger" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav" id="navMain">
                <a href="/music.html">Music</a>
                <a href="/video.html">Video</a>
                <a href="/photos.html" class="active">Photos</a>
                <a href="/dates.html">Dates</a>
                <a href="/booking.html">Booking</a>
                <span class="nav-sep">/</span>
                <a href="/index.html" class="nav-home">Home</a>
            </nav>
        </div>
        <div class="collage">
            <div class="photo"><img loading="lazy" src="Фото/small/0058.webp" alt="Photo" width="933" height="1400"></div>
            <div class="photo"><img loading="lazy" src="Фото/small/0062.webp" alt="Photo" width="933" height="1400"></div>
            <div class="photo"><img loading="lazy" src="Фото/small/0063.webp" alt="Photo" width="933" height="1400"></div>
            <div class="photo"><img loading="lazy" src="Фото/small/0064.webp" alt="Photo" width="933" height="1400"></div>
            <div class="photo"><img loading="lazy" src="Фото/small/0068.webp" alt="Photo" width="933" height="1400"></div>
            <div class="photo"><img loading="lazy" src="Фото/small/0069.webp" alt="Photo" width="933" height="1400"></div>
        </div>
        <div class="footer">© 2026 Mate. All rights reserved.</div>
    </div>
    <script>
        const burger = document.getElementById('burger');
        const navMain = document.getElementById('navMain');
        if (burger) {
            burger.addEventListener('click', () => {
                burger.classList.toggle('open');
                navMain.classList.toggle('open');
            });
        }
    </script>
</body>
</html>
